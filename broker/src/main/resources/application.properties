spring.application.name=broker
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_broker?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL:3}
spring.datasource.hikari.max-lifetime=280000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secreto=${JWT_SECRETO}
jwt.minutos=${JWT_MINUTOS:60}

llave.interna=${LLAVE_INTERNA}
servicios.productos-url=${PRODUCTOS_URL:http://localhost:8081}
servicios.pedidos-url=${PEDIDOS_URL:http://localhost:8082}
servicios.timeout-ms=${TIMEOUT_MS:5000}

admin.usuario=${ADMIN_USUARIO:admin}
admin.password=${ADMIN_PASSWORD:admin123}

springdoc.swagger-ui.path=/swagger-ui.html
