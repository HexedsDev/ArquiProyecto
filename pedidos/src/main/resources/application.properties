spring.application.name=pedidos
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_pedidos?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL:3}
spring.datasource.hikari.max-lifetime=280000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

llave.interna=${LLAVE_INTERNA}
productos.url=${PRODUCTOS_URL:http://localhost:8081}
productos.timeout-ms=${PRODUCTOS_TIMEOUT_MS:3000}

springdoc.swagger-ui.path=/swagger-ui.html
